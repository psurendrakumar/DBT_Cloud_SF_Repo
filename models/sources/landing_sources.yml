version: 2

sources:
  - name: landing
    database: DBT_CLOUD        # optional (required in Snowflake/BigQuery sometimes)
    schema: landing
    description: "Raw data loaded from source systems"

    tables:
      - name: orders
        columns:
          - name: id
            tests:
              - unique:
                 config:
                  severity: warn
              - not_null:
                 config:
                  severity: warn               

      - name: products
        columns:
          - name: id
            tests:
              - unique:
                 config:
                  severity: warn
              - not_null:
                 config:
                  severity: warn               

      - name : reviews
        columns:
          - name: id
            tests:
              - unique:
                 config:
                  severity: warn
              - not_null:
                 config:
                  severity: warn               
          
      - name : users
        columns:
          - name: id
            tests:
              - unique:
                 config:
                  severity: warn
              - not_null:
                 config:
                  severity: warn               
        